<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShieldShare - Restore Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #090C10;
            --card-bg: rgba(18, 22, 31, 0.85);
            --primary: #FFFFFF;
            --primary-hover: #E2E8F0;
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --border-color: rgba(255, 255, 255, 0.12);
            --glow-color: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 30%, #1E293B 0%, var(--bg-color) 80%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            top: 0; left: 0;
            z-index: 0;
        }

        .auth-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 3rem 2.5rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 2.25rem;
        }

        .header h1 {
            font-size: 2.3rem;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: -1px;
            margin-bottom: 0.4rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.92rem;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
            font-weight: 700;
            color: #E2E8F0;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 0.9rem 1.1rem;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            transition: all 0.25s ease;
            outline: none;
        }

        .form-group input.recovery-key-input {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .form-group input::placeholder {
            color: #64748B;
        }

        .form-group input:focus {
            border-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.2);
            background: rgba(15, 23, 42, 0.9);
        }

        .btn-submit {
            width: 100%;
            padding: 0.95rem;
            background: linear-gradient(135deg, #FFFFFF 0%, #E2E8F0 100%);
            border: none;
            border-radius: 12px;
            color: #090C10;
            font-weight: 800;
            font-size: 0.98rem;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
            margin-top: 0.75rem;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            background: #FFFFFF;
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.25);
        }

        .error-message {
            background: rgba(244, 63, 94, 0.12);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: #FECDD3;
            padding: 0.85rem 1.1rem;
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            text-align: center;
            display: none;
        }

        .footer-link {
            text-align: center;
            margin-top: 1.75rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .footer-link a {
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
        }

        .footer-link a:hover {
            border-bottom-color: #FFFFFF;
        }

        .overlay-loader {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 12, 16, 0.92);
            z-index: 100;
            border-radius: 24px;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            font-weight: 600;
            font-size: 1.05rem;
            backdrop-filter: blur(4px);
        }

        .spinner {
            width: 42px; height: 42px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #FFFFFF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1.25rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script src="/static/js/crypto-helper.js"></script>
</head>
<body>
    <div class="auth-container">
        <div class="overlay-loader" id="loader">
            <div class="spinner"></div>
            <div id="loader-text">Decrypting recovery payload...</div>
        </div>

        <div class="header">
            <h1>ShieldShare</h1>
            <p>Restore your cryptographic vault</p>
        </div>

        <div class="error-message" id="error-box"></div>

        <form id="recover-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="recovery_key">16-Character Recovery Key</label>
                <input type="text" id="recovery_key" name="recovery_key" class="recovery-key-input" placeholder="XXXX-XXXX-XXXX-XXXX" required maxlength="19">
            </div>

            <div class="form-group">
                <label for="new_password">New Master Password</label>
                <input type="password" id="new_password" name="new_password" placeholder="••••••••" required autocomplete="new-password">
            </div>

            <button type="submit" class="btn-submit">Restore Vault & Reset Password</button>
        </form>

        <div class="footer-link">
            Remembered your password? <a href="/login">Unlock Vault</a>
        </div>
    </div>

    <script>
        const recoverForm = document.getElementById('recover-form');
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loader-text');
        const errorBox = document.getElementById('error-box');

        recoverForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.style.display = 'none';
            loader.style.display = 'flex';

            const email = document.getElementById('email').value.trim();
            const username = document.getElementById('username').value.trim();
            const recoveryKey = document.getElementById('recovery_key').value.replace(/-/g, '').trim().toUpperCase();
            const newPassword = document.getElementById('new_password').value;

            try {
                loaderText.innerText = 'Retrieving recovery payload...';
                const payloadRes = await fetch(`/get-recovery-payload?username=${encodeURIComponent(username)}&email=${encodeURIComponent(email)}`);
                if (!payloadRes.ok) {
                    const errJson = await payloadRes.json();
                    throw new Error(errJson.message || 'User not found.');
                }
                const recoveryPayload = await payloadRes.json();

                loaderText.innerText = 'Decrypting RSA private key with recovery key...';
                const recoverySalt = stringToBuffer('SHIELDSHARE_RECOVERY_SALT');
                const recoveryDerivedKey = await deriveKeyFromPassword(recoveryKey, recoverySalt);

                const decryptedPrivateKey = await decryptPrivateKey(recoveryPayload.recovery_private_key, recoveryDerivedKey);

                loaderText.innerText = 'Requesting server verification challenge...';
                const challengeRes = await fetch(`/get-recovery-challenge?username=${encodeURIComponent(username)}`);
                if (!challengeRes.ok) {
                    throw new Error('Failed to retrieve verification challenge.');
                }
                const challengeData = await challengeRes.json();

                loaderText.innerText = 'Decrypting server challenge...';
                const decryptedChallengeBuffer = await window.crypto.subtle.decrypt(
                    { name: "RSA-OAEP" },
                    decryptedPrivateKey,
                    base64ToArrayBuffer(challengeData.encrypted_challenge)
                );
                const decryptedChallenge = bufferToString(decryptedChallengeBuffer);

                loaderText.innerText = 'Re-encrypting RSA private key with new password...';
                const newSaltBytes = window.crypto.getRandomValues(new Uint8Array(16));
                const newSaltB64 = arrayBufferToBase64(newSaltBytes.buffer);
                const newPasswordDerivedKey = await deriveKeyFromPassword(newPassword, newSaltBytes.buffer);
                const newEncryptedPrivateKeyB64 = await encryptPrivateKey(decryptedPrivateKey, newPasswordDerivedKey);

                loaderText.innerText = 'Submitting password reset...';
                const resetRes = await fetch('/recover', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        decrypted_challenge: decryptedChallenge,
                        new_encrypted_private_key: newEncryptedPrivateKeyB64,
                        new_private_key_salt: newSaltB64,
                        new_password: newPassword
                    })
                });

                const resetData = await resetRes.json();
                if (!resetRes.ok || resetData.status !== 'success') {
                    throw new Error(resetData.message || 'Vault restoration failed.');
                }

                alert('Vault successfully restored! You can now log in with your new password.');
                window.location.href = '/login';

            } catch (err) {
                console.error(err);
                errorBox.innerText = 'Restoration failed: ' + err.message;
                errorBox.style.display = 'block';
                loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
