<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShieldShare - Unlock Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #090C10;
            --card-bg: rgba(18, 22, 31, 0.85);
            --primary: #FFFFFF;
            --primary-hover: #E2E8F0;
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --border-color: rgba(255, 255, 255, 0.12);
            --glow-color: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 30%, #1E293B 0%, var(--bg-color) 80%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Executive Grid Overlay */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            top: 0; left: 0;
            z-index: 0;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(140px);
            z-index: 1;
            opacity: 0.18;
            animation: float 12s ease-in-out infinite alternate;
        }
        .shape-1 {
            width: 550px;
            height: 550px;
            background: #64748B;
            top: -200px;
            left: -200px;
        }
        .shape-2 {
            width: 450px;
            height: 450px;
            background: #94A3B8;
            bottom: -150px;
            right: -150px;
            animation-delay: -6s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 20px) scale(1.1); }
        }

        .auth-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 3rem 2.5rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 2.25rem;
        }

        .header h1 {
            font-size: 2.3rem;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: -1px;
            margin-bottom: 0.4rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.92rem;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
            font-weight: 700;
            color: #E2E8F0;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 0.9rem 1.1rem;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            transition: all 0.25s ease;
            outline: none;
        }

        .form-group input::placeholder {
            color: #64748B;
        }

        .form-group input:focus {
            border-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.2);
            background: rgba(15, 23, 42, 0.9);
        }

        .btn-submit {
            width: 100%;
            padding: 0.95rem;
            background: linear-gradient(135deg, #FFFFFF 0%, #E2E8F0 100%);
            border: none;
            border-radius: 12px;
            color: #090C10;
            font-weight: 800;
            font-size: 0.98rem;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
            margin-top: 0.75rem;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            background: #FFFFFF;
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.25);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .error-message {
            background: rgba(244, 63, 94, 0.12);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: #FECDD3;
            padding: 0.85rem 1.1rem;
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            text-align: center;
            display: none;
        }

        .footer-link {
            text-align: center;
            margin-top: 1.75rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .footer-link a {
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.2s ease;
        }

        .footer-link a:hover {
            border-bottom-color: #FFFFFF;
        }

        .overlay-loader {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 12, 16, 0.92);
            z-index: 100;
            border-radius: 24px;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            font-weight: 600;
            font-size: 1.05rem;
            backdrop-filter: blur(4px);
        }

        .spinner {
            width: 42px; height: 42px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #FFFFFF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1.25rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script src="/static/js/crypto-helper.js"></script>
</head>
<body>
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>

    <div class="auth-container">
        <div class="overlay-loader" id="loader">
            <div class="spinner"></div>
            <div>Decrypting private vault...</div>
        </div>

        <div class="header">
            <h1>ShieldShare</h1>
            <p>Unlock your secure cryptographic vault</p>
        </div>

        <div class="error-message" id="error-box"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Master Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-submit">Unlock Vault</button>
        </form>

        <div class="footer-link">
            Need a new vault? <a href="/register">Create Vault</a>
            <br>
            Forgot Password? <a href="/recover">Restore Vault</a>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const loader = document.getElementById('loader');
        const errorBox = document.getElementById('error-box');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.style.display = 'none';
            loader.style.display = 'flex';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok || data.status !== 'success') {
                    throw new Error(data.message || 'Invalid Email or Password.');
                }

                const saltBuffer = base64ToArrayBuffer(data.private_key_salt);
                const passwordDerivedKey = await deriveKeyFromPassword(password, saltBuffer);

                const decryptedPrivateKey = await decryptPrivateKey(data.encrypted_private_key, passwordDerivedKey);
                
                const exportedPrivKey = await window.crypto.subtle.exportKey("pkcs8", decryptedPrivateKey);
                const privKeyB64 = arrayBufferToBase64(exportedPrivKey);
                let privatePEM = "-----BEGIN PRIVATE KEY-----\n";
                for (let i = 0; i < privKeyB64.length; i += 64) {
                    privatePEM += privKeyB64.substring(i, i + 64) + "\n";
                }
                privatePEM += "-----END PRIVATE KEY-----";

                // Strictly clear any previous browser session storage to guarantee 100% user isolation
                window.sessionStorage.clear();
                window.sessionStorage.setItem('private_key_pem', privatePEM);
                window.location.href = '/dashboard';

            } catch (err) {
                console.error(err);
                errorBox.innerText = err.message;
                errorBox.style.display = 'block';
                loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
